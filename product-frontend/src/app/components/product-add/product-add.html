<div class="card p-4 p-md-5">
  
  <!-- አዲሱ ተንቀሳቃሽ የማሳወቂያ ሳጥን (Dynamic Notification Alert) -->
<div class="card p-4 p-md-5">
  
  <!-- ይህ የኖቲፊኬሽን ሳጥን መኖሩን ያረጋግጡ -->
  <div *ngIf="notificationMessage" 
       class="alert text-center fw-semibold mb-4 rounded-3 text-white" 
       [style.background-color]="notificationType === 'success' ? '#22c55e' : '#ef4444'">
    {{ notificationMessage }}
  </div>
  <h3 class="fw-bold text-white mb-3">✨ አዲስ ምርት መመዝገቢያ</h3>
  <form (ngSubmit)="saveProduct()" #f="ngForm">
    <div class="mb-3">
      <label class="form-label">የምርት ስም *</label>
      <input type="text" [(ngModel)]="product.name" name="name" class="form-control" placeholder="Dell Laptop" required />
    </div>
    <div class="row mb-3">
      <div class="col-6">
        <label class="form-label">ዋጋ *</label>
        <input type="number" [(ngModel)]="product.price" name="price" class="form-control" placeholder="0.00" required />
      </div>
      <div class="col-6">
        <label class="form-label">布ዛት *</label>
        <input type="number" [(ngModel)]="product.quantity" name="quantity" class="form-control" placeholder="0" required />
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">መግለጫ</label>
      <textarea [(ngModel)]="product.description" name="description" class="form-control" rows="3"></textarea>
    </div>
    <div class="d-flex gap-3">
      <button type="submit" [disabled]="!f.valid || notificationType === 'success'" class="btn btn-primary w-100 py-2">
        {{ notificationType === 'success' ? '⏳ በመቀየር ላይ...' : '💾 አስቀምጥ' }}
      </button>
      <a routerLink="/products" class="btn btn-light w-100 py-2">ተመለስ</a>
    </div>
  </form>
</div>
